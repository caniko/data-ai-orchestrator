# Generated by simit. Manual edits will be reported as ci=drift.
name: build
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- event: push
- event: pull_request
steps:
- name: nix-config
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix --version
  - export NIX_CONFIG="experimental-features = nix-command flakes"
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: nix-check
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c nix flake check
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-fmt
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo fmt --all -- --check
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-test
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo test
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-doc
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo doc --no-deps --all-features
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-audit
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo audit --no-fetch --stale
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-deny
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo deny check bans licenses sources
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-clippy
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo clippy --all-targets -- --deny warnings
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
- name: cargo-package
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c cargo package --allow-dirty --list
  environment:
    CARGO_HOME: /tmp/.cargo
    NIX_CONFIG: experimental-features = nix-command flakes
