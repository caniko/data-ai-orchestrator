[package]
name = "data-ai-orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A durable, policy-driven runtime for reusable data and AI workflows"
license = "Apache-2.0"
repository = "ssh://git@codeberg.org/caniko/data-ai-orchestrator.git"
readme = "README.md"
exclude = ["graphify-out/**", "target/**"]

[features]
default = []
postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]

[dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
uuid = { version = "1.12.1", features = ["v4"] }
sqlx-core = { version = "0.8.6", default-features = false, features = ["json", "_rt-tokio", "_tls-rustls-ring-webpki"], optional = true }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["json"], optional = true }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }
