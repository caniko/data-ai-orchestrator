[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runner = "ubuntu-24.04"
with_msrv = true
with_audit = true
with_deny = true
with_docs = true
runtime = "nix"
provider = "actions"
platform = "github"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "data-ai-orchestrator"
token_secret = "ATTIC_TOKEN"
